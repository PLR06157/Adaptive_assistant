<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QIAGEN Capacity Planning Platform – Proposed Technical Solution Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#B8975A;
    --gold-light:#C5A572;
    --gold-dark:#9A7D42;
    --black:#000000;
    --charcoal:#2C2C2C;
    --white:#FFFFFF;
    --beige:#F8F6F3;
    --green:#4CAF50;
    --red:#F44336;
    --orange:#FF9800;
    --blue:#2196F3;
    --gray:#9E9E9E;
    --grad-gold-h:linear-gradient(90deg,#D4C5A0 0%,#B8975A 50%,#D4C5A0 100%);
    --grad-gold-v:linear-gradient(180deg,#D4C5A0 0%,#B8975A 100%);
    --grad-dark:linear-gradient(135deg,#1A1A1A 0%,#000000 100%);
    --font-head:"Copperplate","Copperplate Gothic Light","Cormorant Garamond",Georgia,serif;
    --font-body:"Open Sans","Roboto",-apple-system,BlinkMacSystemFont,sans-serif;
    --shadow:0px 2px 6px rgba(0,0,0,0.10);
    --shadow-lg:0px 10px 30px rgba(0,0,0,0.12);
    --radius-card:8px;
    --radius-btn:4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--charcoal);
    font-family:var(--font-body);
    color:var(--charcoal);
    height:100vh;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Hexagon watermark ---------- */
  .hex-field{
    position:absolute; inset:0; pointer-events:none; overflow:hidden;
    opacity:0.05; z-index:0;
  }
  .hex-field svg{width:100%;height:100%;}

  /* ---------- App shell ---------- */
  .app{
    position:relative;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--charcoal);
  }

  /* ---------- Stage ---------- */
  .stage{
    flex:1 1 auto;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px 24px;
    min-height:0;
    overflow:hidden;
  }

  /* Fixed-resolution design canvas (16:9). Scaled to fit the viewport on
     screen via JS transform; mapped 1:1 to the printed page at export time,
     so on-screen sizing and PDF output are always identical. */
  .scale-stage{
    position:relative;
    width:1600px; height:900px;
    flex:0 0 auto;
    transform-origin:center center;
  }
  .slide-wrap{
    position:relative;
    width:1600px; height:900px;
  }

  .slide{
    position:absolute; inset:0;
    background:var(--white);
    border-radius:var(--radius-card);
    box-shadow:var(--shadow-lg);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    opacity:0; visibility:hidden;
    transform:translateX(24px);
    transition:opacity .35s ease, transform .35s ease;
  }
  .slide.active{opacity:1; visibility:visible; transform:translateX(0); z-index:5;}
  .slide.leaving-l{transform:translateX(-24px);}

  .slide-band{
    height:6px; flex:0 0 auto;
    background:var(--grad-gold-h);
  }
  .slide-band.alt{background:var(--grad-dark);}

  .slide-header{
    flex:0 0 auto;
    padding:12px 58px 8px 58px;
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:28px;
    border-bottom:1px solid #EEE9E0;
  }
  .slide-eyebrow{
    font-family:var(--font-body);
    font-size:13px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--gold-dark); font-weight:700; margin:0 0 3px 0;
  }
  .slide-title{
    font-family:var(--font-head);
    font-size:26px; line-height:1.15; color:var(--black); margin:0;
    font-weight:700;
  }
  .slide-body{
    flex:1 1 auto;
    overflow:hidden;
    padding:24px 58px 40px 58px;
    background:
      radial-gradient(circle at 100% 0%, rgba(184,151,90,0.05), transparent 45%),
      var(--white);
    position:relative;
  }
  .fit-inner{
    transform-origin:top left;
  }

  .lead{
    font-size:21px; line-height:1.62; color:var(--charcoal); margin:0 0 18px 0;
    max-width:none;
  }
  .lead.big{font-size:23px; color:#333;}
  h3.sec{
    font-family:var(--font-head);
    font-size:21px; letter-spacing:0.03em; color:var(--gold-dark);
    margin:28px 0 12px 0; padding-bottom:9px; border-bottom:2px solid #F0E6D2;
    font-weight:700;
  }
  h3.sec:first-child{margin-top:0;}
  h4.subsec{
    font-family:var(--font-body); font-weight:700; font-size:18px;
    color:var(--black); margin:20px 0 9px 0; letter-spacing:0.02em;
  }
  .b-list{margin:0 0 6px 0; padding:0; list-style:none;}
  .b-list li{
    position:relative; padding-left:26px; margin-bottom:11px;
    font-size:18px; line-height:1.5; color:#333;
  }
  .b-list li::before{
    content:""; position:absolute; left:0; top:9px; width:9px; height:9px;
    background:var(--gold); border-radius:1px; transform:rotate(45deg);
  }
  .b-list.dense li{margin-bottom:6px;}
  .b-list.two-col{columns:2; column-gap:46px;}
  .b-list.two-col li{break-inside:avoid;}
  .b-list.three-col{columns:3; column-gap:34px;}
  .b-list.three-col li{break-inside:avoid;}
  ol.n-list{margin:0; padding-left:0; list-style:none; counter-reset:n;}
  ol.n-list li{
    counter-increment:n; position:relative; padding-left:38px; margin-bottom:12px;
    font-size:18px; line-height:1.5; color:#333;
  }
  ol.n-list li::before{
    content:counter(n); position:absolute; left:0; top:0;
    width:26px;height:26px; border-radius:50%; background:var(--gold-dark); color:#fff;
    font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:32px;}
  .grid-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:23px;}
  .grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:20px;}

  .card{
    background:var(--beige); border:1px solid #EFE6D6; border-radius:var(--radius-card);
    padding:20px 23px; box-shadow:var(--shadow);
  }
  .card.dark{background:var(--grad-dark); color:#fff; border:none;}
  .card.dark .b-list li{color:#e7e0d3;}
  .card.dark h4.subsec{color:var(--gold-light);}
  .card-tag{
    display:inline-block; font-size:14px; letter-spacing:0.08em; text-transform:uppercase;
    color:#fff; background:var(--gold-dark); padding:5px 13px; border-radius:14px; font-weight:700;
    margin-bottom:11px;
  }

  table.data-table{width:100%; border-collapse:collapse; font-size:18px; margin:9px 0 6px 0;}
  table.data-table th{
    background:var(--grad-dark); color:#fff; text-align:left; padding:13px 17px;
    font-weight:600; letter-spacing:0.02em; font-family:var(--font-body);
  }
  table.data-table td{
    padding:12px 17px; border-bottom:1px solid #EFE6D6; color:#333; vertical-align:top;
  }
  table.data-table tr:nth-child(even) td{background:#FBF9F5;}
  table.data-table td.hl{color:var(--gold-dark); font-weight:700;}

  .flow{display:flex; align-items:stretch; gap:0; flex-wrap:wrap;}
  .flow-step{
    flex:1 1 210px; background:var(--beige); border:1px solid #EFE6D6; border-radius:var(--radius-card);
    padding:17px 20px; position:relative; min-width:196px;
  }
  .flow-step .ftitle{
    font-family:var(--font-head); font-weight:700; font-size:18px; color:var(--gold-dark);
    margin-bottom:9px;
  }
  .flow-step ul{margin:0;padding-left:19px;}
  .flow-step li{font-size:15.5px; line-height:1.4; margin-bottom:5px; color:#444;}
  .flow-arrow{
    flex:0 0 34px; display:flex; align-items:center; justify-content:center; color:var(--gold);
    font-size:26px;
  }
  .flow-arrow.down{writing-mode:vertical-lr;}

  .layer-stack{display:flex; flex-direction:column; gap:11px;}
  .layer{
    display:flex; align-items:center; gap:20px; border-radius:var(--radius-card);
    padding:14px 22px; color:#fff; box-shadow:var(--shadow);
  }
  .layer .lname{font-family:var(--font-head); font-weight:700; font-size:18px; min-width:210px;}
  .layer .ldesc{font-size:16.5px; opacity:0.95;}
  .layer.bronze{background:linear-gradient(90deg,#8a5a2f,#6b4322);}
  .layer.silver{background:linear-gradient(90deg,#8f8f8f,#6b6b6b);}
  .layer.gold{background:linear-gradient(90deg,var(--gold),var(--gold-dark));}

  .stat-row{display:flex; gap:16px; flex-wrap:wrap; margin:11px 0 6px 0;}
  .stat-pill{
    background:var(--white); border:1px solid #EFE6D6; border-radius:var(--radius-card);
    padding:11px 19px; box-shadow:var(--shadow); min-width:124px; text-align:center;
  }
  .stat-pill .num{font-family:var(--font-head); font-size:28px; color:var(--gold-dark); font-weight:700;}
  .stat-pill .lbl{font-size:13px; letter-spacing:0.05em; text-transform:uppercase; color:#777;}

  .badge{
    display:inline-block; font-size:14px; padding:3px 12px; border-radius:14px;
    font-weight:700; letter-spacing:0.03em;
  }
  .badge.opt{background:#FFF1DA; color:var(--gold-dark); border:1px solid var(--gold-light);}
  .badge.out{background:#FCE9E7; color:#B23A2E; border:1px solid #E9A79E;}
  .badge.in{background:#E7F4E8; color:#357A3B; border:1px solid #9AD1A1;}

  .risk-card{border-left:5px solid var(--red); background:#FDF4F3; border-radius:0 var(--radius-card) var(--radius-card) 0; padding:17px 22px;}
  .mit-card{border-left:5px solid var(--green); background:#F2F9F2; border-radius:0 var(--radius-card) var(--radius-card) 0; padding:17px 22px;}

  .chart-wrap{background:var(--beige); border:1px solid #EFE6D6; border-radius:var(--radius-card); padding:22px; box-shadow:var(--shadow);}
  .bar-row{display:flex; align-items:center; gap:14px; margin-bottom:13px;}
  .bar-label{width:310px; font-size:16px; color:#333; flex:0 0 auto;}
  .bar-track{flex:1 1 auto; background:#EDE6D8; border-radius:8px; height:22px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--grad-gold-h); border-radius:8px;}
  .bar-val{width:50px; text-align:right; font-size:15px; color:var(--gold-dark); font-weight:700;}

  .gantt{width:100%; border-collapse:collapse; font-size:16px;}
  .gantt th{background:var(--grad-dark); color:#fff; padding:10px 14px; font-weight:600;}
  .gantt td{border:1px solid #EFE6D6; padding:13px 14px; color:#333;}
  .gantt td.phase{background:var(--beige); font-weight:700; color:var(--gold-dark); white-space:nowrap;}
  .gantt td.bar-cell{position:relative; height:36px;}
  .gantt .g-bar{position:absolute; top:7px; bottom:7px; background:var(--grad-gold-h); border-radius:5px;}

  .kpi-chip{
    display:inline-block; background:var(--white); border:1px solid var(--gold-light); color:var(--gold-dark);
    font-size:15.5px; font-weight:600; padding:7px 15px; border-radius:18px; margin:0 8px 8px 0;
  }

  .footer-note{
    margin-top:22px; padding-top:14px; border-top:1px dashed #E3D8C4; font-size:14.5px; color:#999; font-style:italic;
  }

  [contenteditable="true"]{outline:none; border-radius:3px; transition:background .15s ease;}
  [contenteditable="true"]:hover{background:rgba(184,151,90,0.08); cursor:text;}
  [contenteditable="true"]:focus{background:rgba(184,151,90,0.14); box-shadow:0 0 0 1px var(--gold-light);}

  /* ---------- Bottom bar ---------- */
  .bottombar{
    flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:8px;
    padding:12px 10px 16px 10px; background:var(--charcoal); z-index:20;
    flex-wrap:wrap;
  }
  .dot{
    width:8px;height:8px;border-radius:50%; background:rgba(255,255,255,0.25); cursor:pointer; transition:all .2s ease;
    flex:0 0 auto;
  }
  .dot:hover{background:var(--gold-light);}
  .dot.active{background:var(--gold); width:22px; border-radius:5px;}

  .titleslide{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    background:var(--grad-dark); color:#fff; position:relative; overflow:hidden;
  }
  .titleslide .hexbg{position:absolute; inset:0; opacity:0.08;}
  .titleslide .eyebrow2{
    font-size:17px; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold-light); margin-bottom:24px; z-index:2;
  }
  .titleslide h1{
    font-family:var(--font-head); font-size:62px; margin:0 0 18px 0; z-index:2; font-weight:700; max-width:1100px; line-height:1.15;
  }
  .titleslide h2{
    font-family:var(--font-body); font-weight:400; font-size:22px; color:#d8d1c2; margin:0 0 40px 0; z-index:2; max-width:880px; line-height:1.5;
  }
  .titleslide .gold-rule{width:150px; height:4px; background:var(--grad-gold-h); margin:0 0 34px 0; z-index:2;}
  .titleslide .foot{position:absolute; bottom:32px; font-size:14px; color:#9a9284; letter-spacing:0.08em; z-index:2;}

  @page{ size:1600px 900px; margin:0; }
  @media print{
    .topbar,.bottombar{display:none !important;}
    html,body{height:auto !important; overflow:visible !important; background:#fff !important;}
    .app{height:auto !important; display:block !important;}
    .stage{padding:0 !important; display:block !important; height:auto !important; overflow:visible !important;}
    .scale-stage{transform:none !important; width:1600px !important; height:auto !important; margin:0 !important;}
    .slide-wrap{position:static !important; width:1600px !important; height:auto !important;}
    .slide{
      position:relative !important; inset:auto !important;
      opacity:1 !important; visibility:visible !important; transform:none !important;
      width:1600px !important; height:900px !important;
      box-shadow:none !important; border-radius:0 !important;
      page-break-after:always !important; break-after:page !important;
      margin:0 !important;
    }
    .slide:last-child{page-break-after:auto !important; break-after:auto !important;}
    .slide-body{overflow:visible !important;}
  }
</style>
</head>

<div class="app">

<script>
/* ================= HEX WATERMARK GENERATOR ================= */
function hexField(){
  var s = '<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">';
  var w=40, h=34.6, rows=10, cols=12;
  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      var x = c*w*0.75;
      var y = r*h + (c%2? h/2:0);
      s += '<polygon points="'+(x+w*0.25)+','+y+' '+(x+w*0.75)+','+y+' '+(x+w)+','+(y+h/2)+' '+(x+w*0.75)+','+(y+h)+' '+(x+w*0.25)+','+(y+h)+' '+x+','+(y+h/2)+'" fill="none" stroke="#B8975A" stroke-width="0.6"/>';
    }
  }
  s += '</svg>';
  return s;
}

SLIDES.push({eyebrow:"High-Level Solution Architecture", title:"End-to-End Data Flow – Extraction to Business Logic", raw:`

/* ---- 05 End-to-End Data Flow (2) ---- */
SLIDES.push({eyebrow:"High-Level Solution Architecture", title:"End-to-End Data Flow – Semantic Model &amp; Reporting", raw:`
<h3 class="sec">Step 5 – Semantic Model</h3>

/* ================= RENDER ENGINE ================= */
const wrap = document.getElementById('slideWrap');
let current = 0;

function buildSlide(s, idx){
  const el = document.createElement('div');
  el.className = 'slide';
  el.dataset.idx = idx;
  if(s.eyebrow === "" && idx===0){
    el.innerHTML = s.raw;
    wrap.appendChild(el);
    return el;
  }
  const band = idx % 2 === 0 ? '' : ' alt';
  el.innerHTML = `
    <div class="slide-band${band}"></div>
    <div class="slide-header">
      <div>
        <p class="slide-eyebrow" contenteditable="true">${s.eyebrow}</p>
        <h2 class="slide-title" contenteditable="true">${s.title}</h2>
      </div>
    </div>
    <div class="slide-body"><div class="fit-inner">${s.raw}</div></div>
  `;
  wrap.appendChild(el);
  return el;
}

SLIDES.forEach((s,i)=>buildSlide(s,i));

// make text-bearing nodes editable (except ones already explicitly set)
document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body h3, .slide-body h4, .slide-body .card > div:not(.card-tag)').forEach(function(node){
  if(!node.hasAttribute('contenteditable') && node.children.length === 0 || node.tagName==='LI' || node.tagName==='TD' || node.tagName==='P' || node.tagName==='H3' || node.tagName==='H4'){
    if(node.closest('.gantt') && node.tagName==='TD') return;
    node.setAttribute('contenteditable','true');
  }
});
document.querySelectorAll('.kpi-chip, .badge, .stat-pill .num, .stat-pill .lbl, .lname, .ldesc, .ftitle, .flow-step li').forEach(function(node){
  node.setAttribute('contenteditable','true');
});

const slideEls = Array.from(document.querySelectorAll('.slide'));
const total = slideEls.length;

/* ---- Viewport scaling: fit the fixed 1600x900 design canvas into
   whatever window size is available, so on-screen size always tracks
   the same layout used for printing. ---- */
const scaleStage = document.getElementById('scaleStage');
function fitStage(){
  const stageEl = document.querySelector('.stage');
  const availW = stageEl.clientWidth;
  const availH = stageEl.clientHeight;
  const s = Math.min(availW/1600, availH/900);
  scaleStage.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fitStage);

/* ---- Per-slide content auto-fit: shrink a slide's content just enough
   that it fits fully inside the fixed 900px-tall canvas with no
   scrolling – guarantees nothing is cut off on screen or when the
   page is printed / saved as PDF. ---- */
function fitAllSlideBodies(){
  document.querySelectorAll('.slide-body').forEach(function(body){
    const inner = body.querySelector('.fit-inner');
    if(!inner) return;
    inner.style.transform = 'none';
    inner.style.width = '100%';
    const avail = body.clientHeight;
    const natural = inner.scrollHeight;
    if(natural > 0){
      const s = Math.max(0.4, Math.min(1, avail / natural) * 0.965);
      if(s < 0.999){
        inner.style.width = (100 / s) + '%';
        inner.style.transform = 'scale(' + s + ')';
      }
    }
  });
}

function layoutAll(){
  fitStage();
  fitAllSlideBodies();
}

layoutAll();
requestAnimationFrame(layoutAll);
setTimeout(layoutAll, 300);
setTimeout(layoutAll, 900);
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(function(){ requestAnimationFrame(layoutAll); });
}
window.addEventListener('beforeprint', layoutAll);

// re-fit a slide's own content if the person edits text inside it
let fitDebounce;
wrap.addEventListener('input', function(e){
  const body = e.target.closest('.slide-body');
  if(!body) return;
  clearTimeout(fitDebounce);
  fitDebounce = setTimeout(function(){
    const inner = body.querySelector('.fit-inner');
    inner.style.transform = 'none';
    inner.style.width = '100%';
    const avail = body.clientHeight;
    const natural = inner.scrollHeight;
    if(natural > 0){
      const s = Math.max(0.4, Math.min(1, avail / natural) * 0.965);
      if(s < 0.999){
        inner.style.width = (100 / s) + '%';
        inner.style.transform = 'scale(' + s + ')';
      }
    }
  }, 250);
});

/* dots */
const dotsWrap = document.getElementById('dots');
slideEls.forEach((_,i)=>{
  const d = document.createElement('div');
  d.className='dot';
  d.addEventListener('click', ()=>goTo(i));
  dotsWrap.appendChild(d);
});
const dotEls = Array.from(dotsWrap.children);

function render(){
  slideEls.forEach((el,i)=>{
    el.classList.toggle('active', i===current);
    el.classList.toggle('leaving-l', i<current);
  });
  dotEls.forEach((d,i)=>d.classList.toggle('active', i===current));
}
function goTo(i){
  if(i<0||i>=total) return;
  current=i; render();
}

document.addEventListener('keydown', function(e){
  const active = document.activeElement;
  const isEditing = active && active.getAttribute && active.getAttribute('contenteditable')==='true';
  if(isEditing) return;
  if(e.key==='ArrowRight'){ goTo(current+1); }
  if(e.key==='ArrowLeft'){ goTo(current-1); }
});

render();
</script>
