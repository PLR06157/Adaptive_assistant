<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Literacy Assessment – Your Results</title>
</head>
<body style="margin: 0; padding: 0; background-color: #F8F6F3; font-family: 'Open Sans', Arial, sans-serif; line-height: 1.6; color: #2C2C2C;">
    <!-- Outer wrapper -->
    <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="background-color: #F8F6F3;">
        <tr>
            <td align="center" style="padding: 20px 0;">
                <!-- Inner content table -->
                <table role="presentation" width="600" border="0" cellpadding="0" cellspacing="0" style="background-color: #FFFFFF; border-radius: 8px;">

                    <!-- Header Image -->
                    <tr>
                        <td style="padding: 0; line-height: 0;">
                            <img src="image001.jpg" alt="GBS Lions Talks Header" width="600" style="display: block; width: 100%; height: auto; border-radius: 8px 8px 0 0;">
                        </td>
                    </tr>

                    <!-- Title & Badge -->
                    <tr>
                        <td style="padding: 20px 24px 0 24px;">
                            <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td style="border-bottom: 3px solid #B8975A; padding-bottom: 16px; text-align: center;">
                                        <h1 style="font-family: Copperplate, Georgia, 'Times New Roman', serif; color: #B8975A; margin: 0; font-size: 24px; font-weight: 700;">
                                            AI Literacy Assessment
                                        </h1>
                                        <table role="presentation" border="0" cellpadding="0" cellspacing="0" align="center" style="margin-top: 10px;">
                                            <tr>
                                                <td style="background-color: #1976D2; color: #FFFFFF; padding: 5px 14px; border-radius: 4px; font-weight: bold; font-size: 12px; text-transform: uppercase; font-family: 'Open Sans', Arial, sans-serif;">
                                                    Your Results
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Greeting -->
                    <tr>
                        <td style="padding: 20px 24px 0 24px; font-family: 'Open Sans', Arial, sans-serif;">
                            <p style="font-size: 14px; margin: 0 0 12px 0;"><strong>Hi $first_name,</strong></p>
                            <p style="font-size: 14px; margin: 0 0 20px 0;">
                                Thank you for completing the AI Literacy Assessment. Below you will find your personalized results —
                                your overall score, a breakdown by criterion, and actionable feedback to help you continue building your AI skills.
                            </p>
                        </td>
                    </tr>

                    <!-- Assessment Content (injected per-person) -->
                    <tr>
                        <td style="padding: 0 24px 28px 24px; font-family: 'Open Sans', Arial, sans-serif;">
                            $assessment_html
                        </td>
                    </tr>

                </table>
                <!-- End inner content table -->
            </td>
        </tr>
    </table>
    <!-- End outer wrapper -->
</body>
</html>
