            overflow: hidden;
        }

        body::after {
            content: '';
            position: fixed; inset: 0;
            background: repeating-linear-gradient(
                0deg, transparent 0px, transparent 3px,
                rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px
            );
            pointer-events: none; z-index: 2;
        }

        /* ─── BATTLE BANNER ───────────────────────────────────── */
        #battle-banner {
            position: fixed; top: 0; left: 0; right: 0; z-index: 950;
            background: #111; color: #ffcc00;
            font-size: 0.65rem; padding: 11px 18px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 3px solid #ffcc00; letter-spacing: 1px; gap: 12px;
        }
        .banner-center { flex: 1; text-align: center; white-space: nowrap; }
        .banner-blink { animation: banner-blink 0.5s step-end infinite; }
        @keyframes banner-blink { 0%,100%{opacity:1} 50%{opacity:0} }
        #battle-score { color: #fff; }

        .back-btn {
            font-family: 'Press Start 2P', monospace; font-size: 0.58rem;
            color: #ffcc00; text-decoration: none;
            border: 2px solid #ffcc00; padding: 6px 11px;
            letter-spacing: 1px; white-space: nowrap; flex-shrink: 0;
            transition: background 0.07s, color 0.07s;
        }
        .back-btn:hover { background: #ffcc00; color: #111; }
        .score-box { flex-shrink: 0; white-space: nowrap; }

        /* ─── SHARED WINDOWS 98 CHROME ────────────────────────── */
        .win-titlebar {
            display: flex; align-items: center; gap: 6px;
            padding: 5px 6px;
            background: linear-gradient(to right, #000082, #1283d0);
            color: #fff; font-size: 0.58rem; letter-spacing: 1px;
            user-select: none;
        }
        .win-tb-text { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .win-close {
            font-family: 'Press Start 2P', monospace; font-size: 0.42rem;
            width: 24px; height: 24px;
            background: #c0c0c0; border: 2px solid; border-color: #fff #555 #555 #fff;
            color: #000; cursor: pointer; padding: 0; line-height: 1; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .win-close:active { border-color: #555 #fff #fff #555; transform: translate(1px,1px); }

        .win-body {
            background: #c0c0c0;
            border: 3px solid; border-color: #fff #555 #555 #fff; border-top: none;
            display: flex; flex-direction: column; align-items: center;
        }
        .win-sep { width: 100%; border-top: 2px solid #888; border-bottom: 1px solid #fff; flex-shrink: 0; }

        .win-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 10px 12px; }
        .win-btn {
            font-family: 'Press Start 2P', monospace; font-size: 0.5rem;
            padding: 7px 14px; letter-spacing: 1px; cursor: pointer;
            background: #c0c0c0; color: #000;
            border: 2px solid; border-color: #fff #555 #555 #fff;
            min-width: 80px; text-align: center;
        }
        .win-btn:active { border-color: #555 #fff #fff #555; transform: translate(1px,1px); }
        .win-btn-ok {
            background: #000080; color: #fff;
            border-color: #4444bb #00003a #00003a #4444bb;
            animation: ok-blink 0.6s step-end infinite;
        }
        @keyframes ok-blink { 0%,49%{background:#000080} 50%,100%{background:#1010cc} }
        .win-btn-ok:active { border-color: #00003a #4444bb #4444bb #00003a; }

        .win-marquee {
            overflow: hidden; width: 100%; background: #111; color: #ffcc00;
            font-size: 0.48rem; padding: 5px 0; flex-shrink: 0;
        }
        .win-marquee-inner {
            display: inline-block; white-space: nowrap;
            animation: marquee-scroll 7s linear infinite;
        }
        @keyframes marquee-scroll { from{transform:translateX(0)} to{transform:translateX(-50%)} }

        .win-progress-wrap { width: 100%; display: flex; flex-direction: column; gap: 5px; padding: 0 12px; }
        .win-progress-label { font-size: 0.45rem; letter-spacing: 0.5px; color: #333; }
        .win-progress-track {
            width: 100%; height: 18px;
            border: 2px solid; border-color: #555 #fff #fff #555;
            background: #fff; overflow: hidden;
        }
        .win-progress-fill {
            height: 100%;
            background: repeating-linear-gradient(
                90deg, #000080 0px, #000080 10px, #8080ff 10px, #8080ff 12px
            );
            animation: win-prog 2.5s linear infinite;
        }
        @keyframes win-prog { from{width:0%} to{width:100%} }

        /* ─── CHAOS ADS ───────────────────────────────────────── */
        #chaos-ads { position: fixed; inset: 0; pointer-events: none; z-index: 900; }

        .chaos-ad {
            position: fixed; width: 290px;
            pointer-events: auto;
            box-shadow: 4px 4px 0 #000;
            cursor: pointer;
        }
        .chaos-inner {
            padding: 10px 12px 4px;
            display: flex; flex-direction: column; align-items: center; gap: 7px;
            position: relative; width: 100%;
        }
        .chaos-badge {
            position: absolute; top: 8px; right: 8px;
            font-size: 0.52rem; padding: 4px 8px;
            border: 2px solid; background: #c0c0c0;
            animation: badge-bounce 0.4s ease-in-out infinite;
        }
        @keyframes badge-bounce {
            0%,100% { transform: scale(1) rotate(-6deg); }
            50%     { transform: scale(1.25) rotate(-6deg); }
        }
        .chaos-sprite {
            image-rendering: pixelated; display: block;
            animation: sprite-wiggle 0.25s ease-in-out infinite;
        }
        @keyframes sprite-wiggle {
            0%,100% { transform: rotate(-5deg) scale(1.05); }
            50%     { transform: rotate(5deg) scale(1.05); }
        }
        .chaos-name { font-size: 0.62rem; letter-spacing: 1px; text-align: center; }
        .chaos-price {
            font-size: 1.2rem;
            animation: price-blink 0.5s step-end infinite;
        }
        @keyframes price-blink { 0%,59%{opacity:1} 60%,100%{opacity:0} }
        .chaos-timer {
            font-size: 0.52rem; color: #cc0000;
            border: 2px solid; border-color: #555 #fff #fff #555;
            padding: 5px 9px; background: #fff8f8; letter-spacing: 1px;
        }
        .chaos-cta {
            font-family: 'Press Start 2P', monospace; font-size: 0.52rem;
            padding: 8px 14px; letter-spacing: 1px; cursor: pointer; color: #fff;
            border: 2px solid rgba(0,0,0,0.3);
            animation: cta-pulse 0.4s ease-in-out infinite;
        }
        @keyframes cta-pulse {
            0%,100% { transform: scale(1); box-shadow: 3px 3px 0 rgba(0,0,0,0.3); }
            50%     { transform: scale(1.07); box-shadow: 5px 5px 0 rgba(0,0,0,0.3); }
        }

        /* ─── CENTER POPUPS ───────────────────────────────────── */
        #popup-layer { position: fixed; inset: 0; pointer-events: none; z-index: 920; }

        .popup-win {
            position: absolute; width: 310px;
            pointer-events: auto;
            box-shadow: 4px 4px 0 #000;
            transform: scale(0); transform-origin: center center;
        }
        .popup-inner {
            padding: 14px 14px 4px;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            width: 100%;
        }
        .popup-icon-row { display: flex; align-items: flex-start; gap: 12px; width: 100%; }
        .popup-big-icon {
            font-size: 2rem; flex-shrink: 0;
            animation: pop-icon 0.5s ease-in-out infinite;

        .popup-headline {
            font-size: 0.65rem; letter-spacing: 1px; line-height: 1.7; white-space: pre-line;
        }
        .popup-sub {
            font-size: 0.48rem; color: #333; letter-spacing: 0.5px;
            line-height: 1.6; white-space: pre-line;
        }
    </style>
</head>

function edgePos(edge) {
    const W = window.innerWidth, H = window.innerHeight;
    if (edge === 'right' || edge === 'left') {
        const min = BANNER_H + 10, max = H - AD_H - 10;
        return min + Math.random() * Math.max(20, max - min);
    }
    return 20 + Math.random() * Math.max(20, W - AD_W - 40);
}

function spawnAd(key, edge) {
    const a   = adMeta[key];
    const pos = Math.round(edgePos(edge));

    const el = document.createElement('div');
    el.className = 'chaos-ad';
    el.style.zIndex = 900 + Math.floor(Math.random() * 40);

    if (edge === 'right')  { el.style.right  = '0'; el.style.top    = pos + 'px'; }
    if (edge === 'left')   { el.style.left   = '0'; el.style.top    = pos + 'px'; }
    if (edge === 'top')    { el.style.top    = BANNER_H + 'px'; el.style.left = pos + 'px'; }
    if (edge === 'bottom') { el.style.bottom = '0'; el.style.left   = pos + 'px'; }

    const hiddenT = {
        right:  'translateX(calc(100% + 12px))',
        left:   'translateX(calc(-100% - 12px))',
        top:    'translateY(calc(-100% - 12px))',
        bottom: 'translateY(calc(100% + 12px))',
    }[edge];
    el.style.transform  = hiddenT;
    el.style.transition = 'none';

    // Windows title bar
    const tb = document.createElement('div');
    tb.className = 'win-titlebar';
    const tbText = document.createElement('span');
    tbText.className = 'win-tb-text';
    tbText.textContent = '★ ' + a.name;
    const closeBtn = document.createElement('button');
    closeBtn.className = 'win-close';
    closeBtn.textContent = '✕';
    tb.append(tbText, closeBtn);

    // Windows body
    const body = document.createElement('div');
    body.className = 'win-body';

    const inner = document.createElement('div');
    inner.className = 'chaos-inner';

    const badge = document.createElement('div');
    badge.className = 'chaos-badge';
    badge.style.cssText = `color:${a.color};border-color:${a.color}`;
    badge.textContent = a.badge;
    inner.appendChild(badge);

    const cv = document.createElement('canvas');
    cv.className = 'chaos-sprite';
    cv.width = 96; cv.height = 84;
    const ctx = cv.getContext('2d');
    a.grid.forEach((row, r) => row.forEach((k, c) => {
        if (!k) return;
        ctx.fillStyle = a.pal[k];
        ctx.fillRect(c * 6, r * 6, 6, 6);
    }));
    inner.appendChild(cv);

    const name = document.createElement('div');
    name.className = 'chaos-name';
    name.style.color = a.color;
    name.textContent = a.name;
    inner.appendChild(name);

    const price = document.createElement('div');
    price.className = 'chaos-price';
    price.style.color = a.color;

    el.append(tb, body);
    document.getElementById('chaos-ads').appendChild(el);

    el.getBoundingClientRect();
    el.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
    el.style.transform  = 'translate(0, 0)';

    el.addEventListener('click',  ()  => { window.location.href = a.page; });
    cta.addEventListener('click', e   => { e.stopPropagation(); window.location.href = a.page; });

    function doClose() {
        clearInterval(timerInterval);
        el.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
        el.style.transform = hiddenT;
        closedCount++;
        updateScore();
        setTimeout(() => el.remove(), 600);
        setTimeout(() => spawnAd(key, EDGES[Math.floor(Math.random() * EDGES.length)]), 10600);
    }
    closeBtn.addEventListener('click', e => { e.stopPropagation(); doClose(); });
    skip.addEventListener('click',     e => { e.stopPropagation(); doClose(); });
}

function spawnPopup() {
    const data = POPUP_DATA[Math.floor(Math.random() * POPUP_DATA.length)];
    const W = window.innerWidth, H = window.innerHeight;
    const ox = (Math.random() - 0.5) * 320;
    const oy = (Math.random() - 0.5) * 180;
    const left = Math.max(10, Math.min(W - POP_W - 10, W / 2 + ox - POP_W / 2));
    const top  = Math.max(BANNER_H + 10, Math.min(H - 280, H / 2 + oy - 90));

    const el = document.createElement('div');
    el.className = 'popup-win';
    el.style.left   = left + 'px';
    el.style.top    = top  + 'px';
    el.style.zIndex = 940 + Math.floor(Math.random() * 20);

    // Windows title bar
    const tb = document.createElement('div');
    tb.className = 'win-titlebar';
    const tbIcon = document.createElement('span');
    tbIcon.textContent = data.tbIcon + ' ';
    const tbText = document.createElement('span');
    tbText.className = 'win-tb-text';
    tbText.textContent = data.title;
    const closeBtn = document.createElement('button');
    closeBtn.className = 'win-close';
    closeBtn.textContent = '✕';
    tb.append(tbIcon, tbText, closeBtn);

    // Windows body
    const body = document.createElement('div');
    body.className = 'win-body';

    const inner = document.createElement('div');
    inner.className = 'popup-inner';

    const iconRow = document.createElement('div');
    iconRow.className = 'popup-icon-row';
    const bigIcon = document.createElement('div');
    bigIcon.className = 'popup-big-icon';
    bigIcon.textContent = data.bigIcon;
    const txt = document.createElement('div');
    txt.className = 'popup-txt';
    const hl = document.createElement('div');
    hl.className = 'popup-headline';
    hl.textContent = data.headline;
    txt.appendChild(hl);
    if (data.sub) {
        const sub = document.createElement('div');
        sub.className = 'popup-sub';
        sub.textContent = data.sub;
        txt.appendChild(sub);
    }
    iconRow.append(bigIcon, txt);
    inner.appendChild(iconRow);

    if (data.progress) {
        const pw = document.createElement('div'); pw.className = 'win-progress-wrap';
        const pl = document.createElement('div'); pl.className = 'win-progress-label';
        pl.textContent = data.progress;
        const pt = document.createElement('div'); pt.className = 'win-progress-track';
        const pf = document.createElement('div'); pf.className = 'win-progress-fill';
        pt.appendChild(pf);
        pw.append(pl, pt);
        inner.appendChild(pw);
    }

    body.appendChild(inner);

    const sep = document.createElement('div'); sep.className = 'win-sep'; sep.style.marginTop = '10px';
    body.appendChild(sep);

    const btns = document.createElement('div');
    btns.className = 'win-btns';
    const okBtn = document.createElement('button');
    okBtn.className = 'win-btn win-btn-ok';
    okBtn.textContent = data.ok;
    btns.appendChild(okBtn);
    if (data.cancel) {
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'win-btn';
        cancelBtn.textContent = data.cancel;
        cancelBtn.addEventListener('click', e => { e.stopPropagation(); doClose(); });
        btns.appendChild(cancelBtn);
    }
    body.appendChild(btns);

    el.append(tb, body);
    document.getElementById('popup-layer').appendChild(el);

    el.getBoundingClientRect();
    el.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
    el.style.transform  = 'scale(1)';

    function shake() {
        if (!el.isConnected) return;
        el.style.transition = 'transform 0.08s ease-in-out';
        let n = 0;
        const iv = setInterval(() => {
            el.style.transform = `scale(1) translateX(${(n % 2 === 0 ? 1 : -1) * 8}px)`;
            n++;
            if (n >= 6) { clearInterval(iv); el.style.transform = 'scale(1)'; el.style.transition = ''; }
        }, 80);
    }
    const shakeTimer = setTimeout(shake, 1500 + Math.random() * 2000);

    function doClose() {
        clearTimeout(shakeTimer);
        el.style.transition = 'transform 0.15s ease-in';
        el.style.transform  = 'scale(0)';
        closedCount++;
        updateScore();
        setTimeout(() => el.remove(), 180);
        setTimeout(spawnPopup, 5000 + Math.random() * 7000);
    }

    closeBtn.addEventListener('click', e => { e.stopPropagation(); doClose(); });
    okBtn.addEventListener('click',    e => { e.stopPropagation(); doClose(); });
}
