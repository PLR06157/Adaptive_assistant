
<h2 class="sr-only">Program timeline: 6 consolidated phases from April 2026 through November 2027</h2>

<style>
  #gt{
    --bg:#f8f6f3;
    --panel:#ffffff;
    --panel2:#f8f6f3;
    --text:#2c2c2c;
    --muted:#6f6558;
    --line:rgba(154,125,66,.18);
    --lineStrong:rgba(154,125,66,.34);
    --accent:#b8975a;
    --accentLight:#c5a572;
    --accentDark:#9a7d42;
    --shadow:0 2px 6px rgba(0,0,0,.10);
    --fontHead:Copperplate, Georgia, "Times New Roman", serif;
    --font:"Open Sans", Roboto, "Segoe UI", Helvetica, Arial, sans-serif;
    font-family:var(--font);
    font-size:12px;
    color:var(--text);
    position:relative;
    padding:16px;
    border:1px solid var(--line);
    border-radius:8px;
    background:linear-gradient(180deg, rgba(255,255,255,.98) 0%, rgba(248,246,243,.96) 100%);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  #gt::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.55;
    background:
      linear-gradient(90deg, rgba(184,151,90,.045) 0, rgba(184,151,90,0) 20%),
      radial-gradient(circle at 88% 10%, rgba(184,151,90,.10), transparent 22%);
  }
  #gt > *{position:relative;z-index:1;}
  #gts{
    overflow-x:auto;
    border:1px solid var(--line);
    border-radius:8px;
    background:linear-gradient(180deg, rgba(255,255,255,.96) 0%, rgba(248,246,243,.92) 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.75);
  }
  .gr{display:flex;border-bottom:1px solid var(--line);}
  .gr:last-child{border-bottom:none;}
  .gl{width:210px;min-width:210px;max-width:210px;padding:0 10px 0 12px;display:flex;align-items:center;gap:6px;position:sticky;left:0;background:rgba(255,255,255,.96);border-right:1px solid var(--line);z-index:3;overflow:hidden;box-sizing:border-box;}
  .gc{position:relative;width:870px;min-width:870px;flex-shrink:0;}
  .gph .gl,.gph .gc{background:rgba(248,246,243,.86);}
  .gr:not(.gph):hover .gl,.gr:not(.gph):hover .gc{background:rgba(248,246,243,.72);}
  .ml{position:absolute;top:0;bottom:0;width:1px;background:rgba(154,125,66,.12);pointer-events:none;}
  .ql{position:absolute;top:0;bottom:0;width:1px;background:var(--lineStrong);pointer-events:none;}
  .bar{position:absolute;border-radius:8px;top:50%;transform:translateY(-50%);cursor:default;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);}
</style>

<div id="gt">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <span style="font-family:var(--fontHead);font-size:15px;font-weight:700;letter-spacing:.3px;color:var(--accentDark);">Program Timeline</span>
    <span style="font-size:11px;font-weight:600;color:var(--muted);">Apr 2026 – Nov 2027 &nbsp;·&nbsp; 6 phases</span>
  </div>
  <div id="gts"><div id="gti" style="width:1080px;"></div></div>
  <div id="gtleg" style="display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);"></div>
</div>

<script>
(function(){
const CW=870,PH=38,HDR=42;
const PS=new Date('2026-04-20'),PE=new Date('2027-12-01');
const TD=(PE-PS)/864e5;
const tX=d=>(new Date(d)-PS)/864e5/TD*CW;
const tW=(s,e)=>Math.max(3,(new Date(e)-new Date(s))/864e5/TD*CW);

const phases=[
  {id:'k',label:'Program Kick-Off & Set-up',col:'#B8975A',s:'2026-04-20',e:'2026-05-06'},
  {id:'a',label:'Process Assessment & Design',col:'#C5A572',s:'2026-04-27',e:'2026-08-07'},
  {id:'c',label:'Change Management',col:'#9A7D42',s:'2026-06-08',e:'2026-09-28'},
  {id:'p',label:'Pilot Implementation',col:'#7B8B5A',s:'2026-08-10',e:'2026-10-24'},
  {id:'s',label:'Scale-up Roadmap',col:'#A87B5D',s:'2026-10-25',e:'2026-11-05'},
  {id:'r',label:'Enterprise Rollout',col:'#6F6558',s:'2026-11-08',e:'2027-11-04'},
];

const inner=document.getElementById('gti');

function mkRow(h,cls=''){
  const r=document.createElement('div');
  r.className='gr'+(cls?' '+cls:'');
  r.style.height=h+'px';
  return r;
}
function mkGL(h){
  const e=document.createElement('div');
  e.className='gl';
  e.style.height=h+'px';
  return e;
}
function mkGC(h){
  const e=document.createElement('div');
  e.className='gc';
  e.style.height=h+'px';
  return e;
}
function addGrid(c){
  // Quarter lines (Jan, Apr, Jul, Oct) slightly stronger
  const qMonths=[0,3,6,9];
  let d=new Date('2026-05-01');
  while(d<PE){
    const x=tX(d);
    if(x>0&&x<CW){
      const l=document.createElement('div');
      l.className=qMonths.includes(d.getMonth())?'ql':'ml';
      l.style.left=x+'px';
      c.appendChild(l);
    }
    d=new Date(d.getFullYear(),d.getMonth()+1,1);
  }
}

// Header row
{
  const row=mkRow(HDR,'gph');
  const lbl=mkGL(HDR);
  lbl.innerHTML='<span style="font-family:var(--fontHead);font-size:10px;color:var(--accentDark);font-weight:700;letter-spacing:.08em;">PHASE</span>';
  row.appendChild(lbl);
  const c=mkGC(HDR);

  let d=new Date('2026-04-01');
  while(d<PE){
    const ms=new Date(d);
    const me=new Date(d.getFullYear(),d.getMonth()+1,1);
    const x1=Math.max(0,tX(ms<PS?PS:ms));
    const x2=Math.min(CW,tX(me));
    const w=x2-x1;

    if(x2>0&&x1<CW){
      const line=document.createElement('div');
      const isQ=[0,3,6,9].includes(d.getMonth());
      line.className=isQ?'ql':'ml';
      line.style.left=x1+'px';
      c.appendChild(line);
      if(w>=30){
        const lx=document.createElement('div');
        lx.style.cssText=`position:absolute;left:${x1+4}px;width:${w-8}px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;pointer-events:none;`;
        const mo=d.toLocaleString('en-GB',{month:'short'});
        const yr=d.getMonth()===0?` '${String(d.getFullYear()).slice(2)}`:'';
        lx.textContent=mo+yr;
        c.appendChild(lx);
      }
    }
    d=me;
  }
  row.appendChild(c);
  inner.appendChild(row);
}

// Phase rows
phases.forEach(ph=>{
  // Phase header
  {
    const row=mkRow(PH,'gph');
    const lbl=mkGL(PH);
    lbl.innerHTML=`<span style="width:4px;height:18px;background:${ph.col};border-radius:0 2px 2px 0;flex-shrink:0;margin-left:-12px;margin-right:10px;box-shadow:0 0 0 1px rgba(0,0,0,.04);"></span><span style="font-size:11.5px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${ph.label}</span>`;
    row.appendChild(lbl);
    const c=mkGC(PH);
    addGrid(c);
    const pb=document.createElement('div');
    pb.className='bar';
    pb.style.cssText=`left:${tX(ph.s)}px;width:${tW(ph.s,ph.e)}px;height:14px;background:${ph.col};opacity:0.94;border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(0,0,0,.08);`;
    c.appendChild(pb);
    row.appendChild(c);
    inner.appendChild(row);
  }
});

// Today marker (Apr 20, 2026 = project day 0 = x=0; skip as it's the left edge)

// Legend
const leg=document.getElementById('gtleg');
phases.forEach(ph=>{
  const li=document.createElement('div');
  li.style.cssText='display:flex;align-items:center;gap:6px;';
  li.innerHTML=`<span style="width:10px;height:10px;border-radius:999px;background:${ph.col};box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);flex-shrink:0;"></span><span style="font-size:11px;font-weight:600;color:var(--muted);">${ph.label}</span>`;
  leg.appendChild(li);
});
})();
</script>
